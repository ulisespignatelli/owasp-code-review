name: Validar skill
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Estructura, frontmatter y enlaces
        run: python3 tools/validate.py .
      - name: La app de ejemplo compila (no se ejecuta)
        run: python3 -m py_compile examples/vulnerable-notes-app/app.py
